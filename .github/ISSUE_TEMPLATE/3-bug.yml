name: Bug
description: QuietTV did something wrong (a crash, a broken screen, a wrong change).
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: Steps to make it happen, what you expected, and what happened.
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV brand, model and Android version
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Output of `sh quiettv.sh report <TV_IP>`.
      render: markdown
