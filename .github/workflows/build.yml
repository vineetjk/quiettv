# Checks every push and pull request. On main:
#  - when app/AndroidManifest.xml has a versionName that hasn't been released yet, builds both apps
#    (the TV home screen and the QuietTV Setup phone app), signs them and publishes a GitHub Release;
#  - publishes the setup guide in site/ to GitHub Pages.
# To release: bump android:versionCode and android:versionName, then push to main.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the scripts
        run: |
          sh -n quiettv.sh
          sh -n build.sh
          shellcheck -S warning quiettv.sh build.sh

      - name: Check the lists
        run: |
          # Every line of safe.txt is "package | junk|optional | description", and nothing in it is protected.
          bad=$(grep -v '^[[:space:]]*#' lists/safe.txt | grep -v '^[[:space:]]*$' \
            | awk -F'|' '{gsub(/ /,"",$1); gsub(/ /,"",$2); if (NF != 3 || $1 !~ /^[A-Za-z0-9_.]+$/ || ($2 != "junk" && $2 != "optional")) print}')
          [ -z "$bad" ] || { echo "Malformed lines in lists/safe.txt:"; echo "$bad"; exit 1; }
          for p in $(grep -v '^[[:space:]]*#' lists/safe.txt | cut -d'|' -f1 | tr -d ' ' | grep -v '^$'); do
            while IFS= read -r pat; do
              case "$pat" in ''|'#'*) continue ;; esac
              # shellcheck disable=SC2254
              case "$p" in $pat) echo "$p is in safe.txt but matches protected pattern $pat"; exit 1 ;; esac
            done < lists/protected.txt
          done
          echo "lists ok"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 34 and build-tools 34
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build (with a throwaway key)
        run: sh build.sh

      - name: Check the APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify out/quiettv.apk
          "$BT/aapt2" dump badging out/quiettv.apk | head -1
          manifest=$("$BT/aapt2" dump xmltree out/quiettv.apk --file AndroidManifest.xml)
          echo "$manifest" | grep -q 'android.intent.category.HOME' || { echo "HOME intent filter missing"; exit 1; }
          echo "$manifest" | grep -q 'android.accessibilityservice.AccessibilityService' || { echo "Home guard missing"; exit 1; }
          "$BT/apksigner" verify out/quiettv-setup.apk
          "$BT/aapt2" dump badging out/quiettv-setup.apk | head -1
          setup=$("$BT/aapt2" dump xmltree out/quiettv-setup.apk --file AndroidManifest.xml)
          echo "$setup" | grep -q 'android.intent.category.LAUNCHER' || { echo "Setup app launcher entry missing"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: quiettv-test-build
          path: |
            out/quiettv.apk
            out/quiettv-setup.apk

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Is this version released yet?
        id: version
        run: |
          v=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/AndroidManifest.xml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "v$v is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the signed APK
        if: steps.version.outputs.new == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
        run: |
          [ -n "$RELEASE_KEYSTORE_BASE64" ] || { echo "The RELEASE_KEYSTORE_BASE64 secret isn't set (forks can't release)."; exit 1; }
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE="$RUNNER_TEMP/release.jks" KEYSTORE_PASS="$RELEASE_KEYSTORE_PASS" sh build.sh
          rm -f "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs out/quiettv.apk | head -3
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify out/quiettv-setup.apk

      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/quiettv/lists
          cp out/quiettv.apk out/quiettv-setup.apk dist/
          (cd dist && sha256sum quiettv.apk > quiettv.apk.sha256 && sha256sum quiettv-setup.apk > quiettv-setup.apk.sha256)
          # A ready-to-use folder: the script, its lists and the app. No build tools needed.
          cp quiettv.sh README.md LICENSE dist/quiettv/
          cp lists/*.txt dist/quiettv/lists/
          cp out/quiettv.apk dist/quiettv/
          (cd dist && zip -qr "quiettv-$V.zip" quiettv)
          gh release create "v$V" dist/quiettv.apk dist/quiettv.apk.sha256 \
            dist/quiettv-setup.apk dist/quiettv-setup.apk.sha256 "dist/quiettv-$V.zip" \
            --title "QuietTV $V" --generate-notes --target "$GITHUB_SHA"

  pages:
    needs: [check, release]
    # After a release (or when there wasn't one), so the site can carry the latest APK.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp docs/logo-dark.svg docs/icon.svg docs/home-screen.png _site/
          # A copy of the latest home screen app, for installing with the Downloader app on the TV.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern quiettv.apk --dir _site || echo "No release yet"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
